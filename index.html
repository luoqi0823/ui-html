<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>财务、采购与项目管理 UI 预览</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <h1 class="brand-title">成都零一通途科技有限公司</h1>
        </div>

        <div class="menu-group">
          <div class="menu-label">财务管理</div>
          <button class="menu-item active" type="button" data-nav="invoice">
            开票回款
          </button>
          <button class="menu-item" type="button" data-nav="cost">
            成本费用
          </button>
          <button class="menu-item" type="button" data-nav="revenue">
            收入确认
          </button>
          <button class="menu-item" type="button" data-nav="payment-management">
            支付管理
          </button>
        </div>

        <div class="menu-group">
          <div class="menu-label">采购管理</div>
          <button class="menu-item" type="button" data-nav="suppliers">
            供应商管理
          </button>
          <button class="menu-item" type="button" data-nav="plans">
            采购计划
          </button>
          <button class="menu-item" type="button" data-nav="requests">
            采购申请
          </button>
          <button class="menu-item" type="button" data-nav="inquiries">
            比价询价
          </button>
          <button class="menu-item" type="button" data-nav="contracts">
            采购合同签订
          </button>
          <button class="menu-item" type="button" data-nav="payment-requests">
            付款申请
          </button>
          <button class="menu-item" type="button" data-nav="stock">
            出入库登记
          </button>
        </div>

        <div class="menu-group">
          <div class="menu-label">项目管理</div>
          <button class="menu-item" type="button" data-nav="customers">
            客户管理
          </button>
        </div>

        <div class="sidebar-footer">
          <p>静态高保真原型</p>
          <p>布局优先参考现有后台风格，字段和弹窗按需求文档补齐。</p>
        </div>
      </aside>

      <main class="workspace">
        <header class="header">
          <div class="breadcrumbs">
            <span id="breadcrumb-parent">财务管理</span>
            <span>/</span>
            <span id="breadcrumb-page">开票回款</span>
          </div>

          <div class="user-chip">
            <div class="avatar avatar-neutral">◔</div>
            <div>
              <div class="user-name">superadmin@local.dev</div>
            </div>
          </div>
        </header>

        <div class="content">
          <div id="screen-root"></div>
        </div>
      </main>
    </div>

    <div class="overlay-mask" id="project-mask" hidden>
      <div class="overlay-panel overlay-panel-720" role="dialog" aria-modal="true">
        <div class="overlay-header">
          <div>
            <h2 class="overlay-title">选择交付项目</h2>
            <p class="overlay-subtitle">
              仅用于财务相关页面切换项目上下文，切换后统计卡片与表格同步更新。
            </p>
          </div>
          <button class="overlay-close" type="button" data-close="project">
            ×
          </button>
        </div>
        <div class="overlay-body">
          <input
            class="control-input control-input-full"
            id="project-search-input"
            type="text"
            placeholder="搜索项目名称 / 项目编号 / 客户名称"
          />
          <div class="project-option-list" id="project-option-list"></div>
        </div>
        <div class="overlay-footer">
          <button class="btn" type="button" data-close="project">取消</button>
          <button class="btn primary" type="button" id="project-confirm-btn">
            确定
          </button>
        </div>
      </div>
    </div>

    <div class="overlay-mask" id="modal-mask" hidden></div>
    <div class="drawer-mask" id="drawer-mask" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
